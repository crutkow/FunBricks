<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FunBricks Proton Game</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100vh;
        background: #061221;
        color: #f5f7fb;
        font-family: Segoe UI, system-ui, sans-serif;
      }
      #game-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui {
        position: absolute;
        z-index: 10;
        top: 16px;
        left: 16px;
        pointer-events: none;
      }
      #ui h1 {
        margin: 0;
        font-size: 1.2rem;
      }
      #ui p {
        margin: 4px 0 0;
        color: #9bb4d7;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="ui">
      <h1>FunBricks Proton Game</h1>
      <p>HTML5 rendering and particle physics powered by Proton.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
